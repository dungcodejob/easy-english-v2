<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Typing Mode | Scholarly Sanctuary</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-dim": "#dad9dd",
                      "on-primary-fixed-variant": "#2e476f",
                      "surface-variant": "#e3e2e6",
                      "on-primary": "#ffffff",
                      "surface-tint": "#465f88",
                      "inverse-on-surface": "#f1f0f4",
                      "on-error": "#ffffff",
                      "tertiary-fixed-dim": "#ffb954",
                      "tertiary-container": "#4d3000",
                      "inverse-primary": "#aec7f7",
                      "on-tertiary": "#ffffff",
                      "primary-fixed": "#d6e3ff",
                      "surface-container-lowest": "#ffffff",
                      "primary": "#002046",
                      "on-surface": "#1a1b1e",
                      "secondary-fixed-dim": "#7ad7c6",
                      "tertiary-fixed": "#ffddb4",
                      "tertiary": "#311d00",
                      "inverse-surface": "#2f3033",
                      "on-tertiary-fixed-variant": "#633f00",
                      "secondary-container": "#94f0df",
                      "primary-fixed-dim": "#aec7f7",
                      "on-tertiary-fixed": "#291800",
                      "on-secondary-container": "#006f62",
                      "on-primary-fixed": "#001b3d",
                      "on-secondary": "#ffffff",
                      "primary-container": "#1b365d",
                      "on-background": "#1a1b1e",
                      "background": "#faf9fd",
                      "surface-container-low": "#f4f3f7",
                      "error-container": "#ffdad6",
                      "on-tertiary-container": "#d4922a",
                      "on-surface-variant": "#44474e",
                      "secondary-fixed": "#97f3e2",
                      "surface": "#faf9fd",
                      "on-primary-container": "#87a0cd",
                      "on-secondary-fixed-variant": "#005047",
                      "outline": "#74777f",
                      "on-error-container": "#93000a",
                      "surface-container-high": "#e9e7eb",
                      "on-secondary-fixed": "#00201b",
                      "error": "#ba1a1a",
                      "surface-container-highest": "#e3e2e6",
                      "secondary": "#006b5e",
                      "surface-bright": "#faf9fd",
                      "outline-variant": "#c4c6cf",
                      "surface-container": "#efedf1"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Lexend"],
                      "body": ["Be Vietnam Pro"],
                      "label": ["Be Vietnam Pro"]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #002046 }
        }
        .bg-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col overflow-hidden">
<!-- Top Navigation (Shell Implementation) -->
<header class="flex justify-between items-center w-full px-6 py-4 sticky top-0 z-50 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-xl">
<div class="flex items-center gap-4">
<button class="hover:bg-slate-200/50 p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-blue-950 dark:text-white" data-icon="close">close</span>
</button>
<div class="hidden md:block">
<span class="text-lg font-bold text-blue-950 dark:text-white font-headline tracking-tight">Scholarly Sanctuary</span>
</div>
</div>
<!-- Progress Center -->
<div class="flex-1 max-w-md mx-8 flex flex-col items-center gap-2">
<div class="w-full bg-surface-variant h-2 rounded-full overflow-hidden">
<div class="bg-tertiary-fixed-dim h-full rounded-full transition-all duration-500 ease-out" style="width: 60%;"></div>
</div>
<span class="font-label text-xs font-semibold text-on-surface-variant tracking-widest uppercase">12 / 20 Words</span>
</div>
<div class="flex items-center gap-3 bg-tertiary-fixed/30 px-4 py-2 rounded-full border border-tertiary-fixed/20">
<span class="material-symbols-outlined text-orange-500" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-headline font-bold text-on-tertiary-fixed">5</span>
</div>
</header>
<!-- Main Focused Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-6 relative overflow-hidden">
<!-- Subtle background texture -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none flex items-center justify-center">
<div class="w-[800px] h-[800px] bg-gradient-to-br from-primary/10 to-transparent rounded-full blur-[120px]"></div>
</div>
<!-- Content Container -->
<div class="relative z-10 w-full max-w-2xl flex flex-col items-center space-y-12">
<!-- Definition Section -->
<section class="text-center space-y-4">
<span class="font-label text-sm text-secondary font-semibold uppercase tracking-[0.2em]">Definition</span>
<h1 class="font-headline text-3xl md:text-4xl text-on-surface leading-tight max-w-xl mx-auto font-light">
                    “Lasting for a very short time; <span class="font-semibold text-primary">fleeting</span> or transitory in nature.”
                </h1>
</section>
<!-- Typing Interaction Section -->
<div class="w-full space-y-8 flex flex-col items-center">
<div class="w-full relative">
<!-- High-end Focus Input -->
<div class="group flex flex-col items-center w-full">
<input autofocus="" class="w-full text-center bg-transparent border-none focus:ring-0 text-5xl md:text-6xl font-headline font-bold text-primary placeholder:text-surface-dim/80 caret-transparent peer" placeholder="Type the word..." type="text"/>
<!-- Custom Animated Underline -->
<div class="h-1 w-32 bg-primary transition-all duration-300 peer-focus:w-full peer-placeholder-shown:w-16 rounded-full mt-4"></div>
<!-- Visual Feedback Indicator -->
<div class="mt-6 flex items-center gap-2 text-on-surface-variant font-label text-sm opacity-60 peer-focus:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm" data-icon="keyboard">keyboard</span>
<span>Listening for keystrokes...</span>
</div>
</div>
</div>
<!-- Action Hub -->
<div class="flex flex-col md:flex-row items-center gap-4 w-full justify-center pt-8">
<button class="px-8 py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full font-headline font-semibold shadow-lg shadow-primary/10 hover:shadow-primary/20 transition-all active:scale-95 flex items-center gap-3">
                        Enter to Check
                        <span class="material-symbols-outlined text-[18px]" data-icon="keyboard_return">keyboard_return</span>
</button>
<button class="px-6 py-4 text-on-primary-fixed-variant font-label font-medium hover:bg-surface-container-low rounded-full transition-colors flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="lightbulb">lightbulb</span>
                        Show First Letter
                    </button>
</div>
</div>
</div>
</main>
<!-- Footer Meta (Optional Task Specifics) -->
<footer class="p-8 flex justify-center opacity-40">
<div class="flex items-center gap-8 text-[11px] font-label font-semibold uppercase tracking-[0.3em]">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span>Latin Root</span>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary-fixed-dim"></span>
<span>Advanced Vocab</span>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-outline"></span>
<span>Oxford 5k</span>
</div>
</div>
</footer>
<!-- Decorative Corner Element -->
<div class="fixed bottom-0 right-0 p-8 z-0 hidden lg:block opacity-20 select-none">
<div class="text-[120px] font-headline font-black text-surface-container-highest tracking-tighter transform rotate-[-15deg] translate-x-10 translate-y-10">
            EPH
        </div>
</div>
</body></html>
