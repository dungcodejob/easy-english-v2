<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Scholarly Sanctuary - Quiz Mode</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dad9dd",
                        "on-primary-fixed-variant": "#2e476f",
                        "surface-variant": "#e3e2e6",
                        "on-primary": "#ffffff",
                        "surface-tint": "#465f88",
                        "inverse-on-surface": "#f1f0f4",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb954",
                        "tertiary-container": "#4d3000",
                        "inverse-primary": "#aec7f7",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#d6e3ff",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#002046",
                        "on-surface": "#1a1b1e",
                        "secondary-fixed-dim": "#7ad7c6",
                        "tertiary-fixed": "#ffddb4",
                        "tertiary": "#311d00",
                        "inverse-surface": "#2f3033",
                        "on-tertiary-fixed-variant": "#633f00",
                        "secondary-container": "#94f0df",
                        "primary-fixed-dim": "#aec7f7",
                        "on-tertiary-fixed": "#291800",
                        "on-secondary-container": "#006f62",
                        "on-primary-fixed": "#001b3d",
                        "on-secondary": "#ffffff",
                        "primary-container": "#1b365d",
                        "on-background": "#1a1b1e",
                        "background": "#faf9fd",
                        "surface-container-low": "#f4f3f7",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#d4922a",
                        "on-surface-variant": "#44474e",
                        "secondary-fixed": "#97f3e2",
                        "surface": "#faf9fd",
                        "on-primary-container": "#87a0cd",
                        "on-secondary-fixed-variant": "#005047",
                        "outline": "#74777f",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e9e7eb",
                        "on-secondary-fixed": "#00201b",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e3e2e6",
                        "secondary": "#006b5e",
                        "surface-bright": "#faf9fd",
                        "outline-variant": "#c4c6cf",
                        "surface-container": "#efedf1"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Lexend"],
                        "body": ["Be Vietnam Pro"],
                        "label": ["Be Vietnam Pro"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .bg-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        h1, h2, h3, .font-lexend {
            font-family: 'Lexend', sans-serif;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Task-focused Consistent Header -->
<header class="w-full px-6 py-4 flex flex-col gap-4 sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant/30">
<div class="max-w-6xl mx-auto w-full flex flex-col gap-4">
<div class="flex justify-between items-center gap-4">
<div class="flex items-center gap-4">
<!-- Exit Button -->
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors scale-95 active:duration-150">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<!-- App Name -->
<span class="font-headline font-bold text-lg text-primary hidden sm:block">Scholarly Sanctuary</span>
</div>
<!-- Session Info & Stats -->
<div class="flex items-center gap-3 sm:gap-6">
<!-- Streak Indicator -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-orange-100 text-orange-700 font-headline font-bold text-sm">
<span>🔥</span>
<span>5</span>
</div>
<!-- Session Type -->
<div class="hidden md:flex items-center gap-2 text-on-surface-variant font-label text-sm font-medium">
<span class="material-symbols-outlined text-lg" data-icon="school">school</span>
<span>Session: Advanced Business</span>
</div>
<!-- Countdown Timer -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface font-headline font-semibold text-sm">
<span>⏱</span>
<span>00:42</span>
</div>
</div>
</div>
<!-- Progress Row -->
<div class="w-full flex items-center gap-4">
<div class="flex-1 h-2.5 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-tertiary-fixed-dim w-[60%] rounded-full shadow-[0_0_8px_rgba(255,185,84,0.4)]"></div>
</div>
<span class="font-headline font-semibold text-sm text-on-surface-variant tracking-tighter whitespace-nowrap">12 / 20</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-6 pb-20 max-w-4xl mx-auto w-full">
<!-- Question Section (Asymmetric & Heroic) -->
<section class="w-full mb-12 mt-8 text-center md:text-left">
<div class="inline-block px-4 py-1.5 mb-6 rounded-full bg-primary-fixed text-on-primary-fixed text-xs font-bold uppercase tracking-widest font-headline">
                Vocabulary Challenge
            </div>
<h1 class="text-5xl md:text-7xl font-headline font-extrabold text-primary tracking-tight mb-4 leading-none">
                Negotiate
            </h1>
<p class="text-xl md:text-2xl text-on-surface-variant font-light leading-relaxed max-w-2xl">
                To discuss something in an attempt to reach an agreement.
            </p>
</section>
<!-- Options Bento Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
<!-- Option A -->
<button class="group relative flex items-center justify-between p-6 rounded-xl bg-surface-container-lowest border-2 border-transparent hover:border-outline-variant hover:bg-surface-container-low transition-all duration-200 text-left scale-95 active:duration-150 shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
<div class="flex flex-col gap-1">
<span class="text-xs font-headline font-bold text-on-surface-variant uppercase tracking-widest">Option A</span>
<span class="text-lg font-semibold text-on-surface leading-tight">Argue</span>
</div>
<div class="flex items-center gap-3">
<span class="hidden group-hover:block text-xs font-bold text-outline">Shortcut: 1</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant group-hover:border-outline transition-colors"></div>
</div>
</button>
<!-- Option B (Selected State) -->
<button class="group relative flex items-center justify-between p-6 rounded-xl bg-primary-container border-2 border-primary ring-4 ring-primary/5 transition-all duration-300 text-left shadow-[0_12px_32px_rgba(0,32,70,0.1)]">
<div class="flex flex-col gap-1">
<span class="text-xs font-headline font-bold text-on-primary-container uppercase tracking-widest">Option B</span>
<span class="text-lg font-bold text-white leading-tight">Discuss to reach agreement</span>
</div>
<div class="flex items-center gap-3">
<span class="text-xs font-bold text-on-primary-container/60">Shortcut: 2</span>
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white text-xl" data-icon="check" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
</button>
<!-- Option C -->
<button class="group relative flex items-center justify-between p-6 rounded-xl bg-surface-container-lowest border-2 border-transparent hover:border-outline-variant hover:bg-surface-container-low transition-all duration-200 text-left scale-95 active:duration-150 shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
<div class="flex flex-col gap-1">
<span class="text-xs font-headline font-bold text-on-surface-variant uppercase tracking-widest">Option C</span>
<span class="text-lg font-semibold text-on-surface leading-tight">Cancel</span>
</div>
<div class="flex items-center gap-3">
<span class="hidden group-hover:block text-xs font-bold text-outline">Shortcut: 3</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant transition-colors"></div>
</div>
</button>
<!-- Option D -->
<button class="group relative flex items-center justify-between p-6 rounded-xl bg-surface-container-lowest border-2 border-transparent hover:border-outline-variant hover:bg-surface-container-low transition-all duration-200 text-left scale-95 active:duration-150 shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
<div class="flex flex-col gap-1">
<span class="text-xs font-headline font-bold text-on-surface-variant uppercase tracking-widest">Option D</span>
<span class="text-lg font-semibold text-on-surface leading-tight">Ignore</span>
</div>
<div class="flex items-center gap-3">
<span class="hidden group-hover:block text-xs font-bold text-outline">Shortcut: 4</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant transition-colors"></div>
</div>
</button>
</div>
<!-- Decorative Illustration Element (Subtle) -->
<div class="mt-16 opacity-30 pointer-events-none select-none">
<img alt="background pattern" class="w-64 h-64 object-contain mask-image-gradient" data-alt="smooth gradient flowing from deep navy to soft lavender with subtle grain texture and abstract fluid shapes" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAguuYaTtuQWCwAO6f2Jm5LCwoC53sVnnXQciPlKarsIIDPq0cXIcyzJ4BhMLV9XgVJYfjdnVChREZChAgpXdWaJgchcrIRHHfZBy_dtIBStDWVUaXgn9CAE3_bZjllaRIBHhvzpKur-ycj52HqKRrvjFqCZkTFDuGxadUOD-S8HjvgNMu4pdBls-sSPBvx9qbH1G00Cmcty531JRY8UV5TbDbDmxtcGNznKOzz0ph0IAY8y-7jsfpowrX4Pkvtdf7fE28qvEP_uI"/>
</div>
</main>
<!-- Footer Action Area (Clean & Focused) -->
<footer class="w-full max-w-4xl mx-auto px-6 py-8 flex flex-col md:flex-row items-center justify-between gap-6">
<button class="text-on-primary-fixed-variant font-headline font-semibold text-sm hover:underline underline-offset-4 tracking-wide transition-all">
            Skip this question
        </button>
<button class="w-full md:w-auto px-10 py-4 bg-gradient-to-br from-primary to-primary-container text-white rounded-full font-headline font-bold text-lg shadow-xl shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
            Confirm Answer
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</body></html>
