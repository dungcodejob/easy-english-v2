<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "tertiary-fixed-dim": "#ffb68f",
                    "secondary-fixed": "#a3f69c",
                    "on-tertiary-container": "#ff9455",
                    "error": "#ba1a1a",
                    "secondary-fixed-dim": "#88d982",
                    "surface-variant": "#e1e3e4",
                    "inverse-surface": "#2e3132",
                    "surface-container": "#edeeef",
                    "on-secondary-container": "#217128",
                    "secondary": "#1c6d24",
                    "tertiary-container": "#712f00",
                    "on-secondary-fixed-variant": "#005312",
                    "tertiary-fixed": "#ffdbca",
                    "primary-container": "#2b3896",
                    "on-background": "#191c1d",
                    "error-container": "#ffdad6",
                    "outline": "#767683",
                    "on-primary-fixed-variant": "#303c9a",
                    "on-tertiary-fixed-variant": "#773200",
                    "on-primary-container": "#9fa9ff",
                    "primary-fixed-dim": "#bcc2ff",
                    "secondary-container": "#a0f399",
                    "primary": "#0f1e80",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#e1e3e4",
                    "surface-dim": "#d9dadb",
                    "outline-variant": "#c6c5d4",
                    "on-tertiary-fixed": "#331200",
                    "on-primary-fixed": "#000c62",
                    "on-surface": "#191c1d",
                    "inverse-primary": "#bcc2ff",
                    "surface-container-high": "#e7e8e9",
                    "primary-fixed": "#dfe0ff",
                    "on-secondary": "#ffffff",
                    "tertiary": "#4e1e00",
                    "surface-tint": "#4955b4",
                    "surface-container-low": "#f3f4f5",
                    "surface": "#f8f9fa",
                    "inverse-on-surface": "#f0f1f2",
                    "on-secondary-fixed": "#002203",
                    "surface-bright": "#f8f9fa",
                    "on-tertiary": "#ffffff",
                    "background": "#f8f9fa",
                    "surface-container-lowest": "#ffffff",
                    "on-surface-variant": "#454652"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface">
<!-- Background Mockup: Topics List View (Blurred) -->
<div class="fixed inset-0 z-0 overflow-hidden blur-md saturate-50 opacity-60">
<!-- TopAppBar (Simulated Background) -->
<header class="flex justify-between items-center px-6 py-3 w-full bg-slate-50/80 backdrop-blur-md">
<div class="text-xl font-bold tracking-tight text-indigo-900">Focused Academic</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-indigo-900">notifications</span>
<span class="material-symbols-outlined text-indigo-900">account_circle</span>
</div>
</header>
<!-- SideNav (Simulated Background) -->
<aside class="fixed left-0 top-0 h-full w-64 bg-slate-50 flex flex-col py-8 px-4">
<div class="mb-10 px-4">
<div class="font-manrope font-black text-indigo-900 text-2xl">The Study</div>
<div class="text-xs text-slate-500 uppercase tracking-widest mt-1">Academic Focus</div>
</div>
<nav class="space-y-2">
<div class="flex items-center gap-3 px-4 py-3 text-slate-500"><span class="material-symbols-outlined">book_2</span>Library</div>
<div class="flex items-center gap-3 px-4 py-3 text-indigo-900 font-bold border-r-4 border-indigo-900 bg-slate-200/50"><span class="material-symbols-outlined">category</span>Topics</div>
<div class="flex items-center gap-3 px-4 py-3 text-slate-500"><span class="material-symbols-outlined">analytics</span>Insights</div>
<div class="flex items-center gap-3 px-4 py-3 text-slate-500"><span class="material-symbols-outlined">inventory_2</span>Archive</div>
</nav>
</aside>
<!-- Main Content Area (Simulated Background) -->
<main class="ml-64 pt-20 px-10">
<div class="flex justify-between items-end mb-12">
<div>
<h1 class="text-4xl font-extrabold text-indigo-900 tracking-tight">Topics</h1>
<p class="text-on-surface-variant mt-2">Manage your academic focus areas and research modules.</p>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
<!-- Mock Topic Cards -->
<div class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/10 h-48"></div>
<div class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/10 h-48"></div>
<div class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/10 h-48"></div>
<div class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/10 h-48"></div>
</div>
</main>
</div>
<!-- Overlay Darkener -->
<div class="fixed inset-0 bg-on-surface/20 backdrop-blur-[2px] z-40"></div>
<!-- Modal: New Topic Dialog -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
<div class="bg-surface-container-lowest w-full max-w-lg rounded-lg shadow-2xl overflow-hidden ring-1 ring-outline-variant/20">
<!-- Modal Header -->
<div class="px-8 pt-8 pb-4 flex justify-between items-start">
<div>
<h2 class="text-2xl font-bold text-indigo-900 tracking-tight">Create New Topic</h2>
<p class="text-on-surface-variant text-sm mt-1">Organize your study path with a dedicated focus area.</p>
</div>
<button class="text-outline hover:text-indigo-900 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Content (Form) -->
<div class="px-8 py-4 space-y-6">
<!-- Topic Name Input -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-indigo-900/80">Topic Name</label>
<input class="w-full bg-surface-container-low border-none rounded-sm px-4 py-3 text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/50" placeholder="e.g. Advanced Linguistics" type="text"/>
</div>
<!-- Description Textarea -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-indigo-900/80">Description</label>
<textarea class="w-full bg-surface-container-low border-none rounded-sm px-4 py-3 text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/50 resize-none" placeholder="Define the scope of this research topic..." rows="3"></textarea>
</div>
<!-- Icon Selection Grid -->
<div class="space-y-3">
<label class="block text-sm font-semibold text-indigo-900/80">Select Category Icon</label>
<div class="grid grid-cols-6 gap-3">
<button class="aspect-square flex items-center justify-center rounded-lg bg-primary-container text-on-primary-container ring-2 ring-primary ring-offset-2">
<span class="material-symbols-outlined" data-icon="book_2">book_2</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="science">science</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="language">language</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="psychology">psychology</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="history_edu">history_edu</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="school">school</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="functions">functions</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="architecture">architecture</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="calculate">calculate</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-surface-container-low text-outline hover:text-indigo-900 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="palette">palette</span>
</button>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-8 py-8 flex gap-3">
<button class="flex-1 py-3 px-6 bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold rounded-md hover:opacity-90 active:scale-95 transition-all">
                    Create Topic
                </button>
<button class="px-8 py-3 bg-transparent border border-outline-variant text-indigo-900 font-semibold rounded-md hover:bg-surface-container-low active:scale-95 transition-all">
                    Cancel
                </button>
</div>
</div>
</div>
</body></html>
