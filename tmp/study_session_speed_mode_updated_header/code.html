<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dad9dd",
                        "on-primary-fixed-variant": "#2e476f",
                        "surface-variant": "#e3e2e6",
                        "on-primary": "#ffffff",
                        "surface-tint": "#465f88",
                        "inverse-on-surface": "#f1f0f4",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb954",
                        "tertiary-container": "#4d3000",
                        "inverse-primary": "#aec7f7",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#d6e3ff",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#002046",
                        "on-surface": "#1a1b1e",
                        "secondary-fixed-dim": "#7ad7c6",
                        "tertiary-fixed": "#ffddb4",
                        "tertiary": "#311d00",
                        "inverse-surface": "#2f3033",
                        "on-tertiary-fixed-variant": "#633f00",
                        "secondary-container": "#94f0df",
                        "primary-fixed-dim": "#aec7f7",
                        "on-tertiary-fixed": "#291800",
                        "on-secondary-container": "#006f62",
                        "on-primary-fixed": "#001b3d",
                        "on-secondary": "#ffffff",
                        "primary-container": "#1b365d",
                        "on-background": "#1a1b1e",
                        "background": "#faf9fd",
                        "surface-container-low": "#f4f3f7",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#d4922a",
                        "on-surface-variant": "#44474e",
                        "secondary-fixed": "#97f3e2",
                        "surface": "#faf9fd",
                        "on-primary-container": "#87a0cd",
                        "on-secondary-fixed-variant": "#005047",
                        "outline": "#74777f",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e9e7eb",
                        "on-secondary-fixed": "#00201b",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e3e2e6",
                        "secondary": "#006b5e",
                        "surface-bright": "#faf9fd",
                        "outline-variant": "#c4c6cf",
                        "surface-container": "#efedf1"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Lexend"],
                        "body": ["Be Vietnam Pro"],
                        "label": ["Be Vietnam Pro"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .timer-glow {
            text-shadow: 0 0 20px rgba(186, 26, 26, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- Updated Unified Study Header -->
<header class="bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-xl text-blue-900 dark:text-blue-100 font-lexend tracking-tight docked full-width top-0 border-b border-outline-variant/10 flat-no-shadows flex flex-col md:flex-row justify-between items-center w-full px-6 py-3 sticky top-0 z-50 gap-4">
<div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
<button aria-label="Exit Session" class="p-2 -ml-2 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<span class="text-lg font-bold text-blue-950 dark:text-white">Scholarly Sanctuary</span>
<div class="hidden md:block h-6 w-[1px] bg-outline-variant/30"></div>
<div class="hidden md:flex items-center gap-2 text-sm font-medium text-on-surface-variant">
<span class="material-symbols-outlined text-sm">school</span>
<span>Session: Advanced Business</span>
</div>
</div>
<div class="flex items-center gap-6 w-full md:w-auto justify-around md:justify-end">
<div class="flex flex-col items-center md:items-end">
<span class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold leading-none mb-1">Progress</span>
<span class="font-headline font-bold text-primary text-base">12 / 20</span>
</div>
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold leading-none mb-1">Streak</span>
<span class="font-headline font-bold text-orange-600 text-base flex items-center gap-1">🔥 5</span>
</div>
<div class="flex flex-col items-center md:items-start">
<span class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold leading-none mb-1">Time Left</span>
<span class="font-headline font-bold text-error text-base flex items-center gap-1">⏱ 00:42</span>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 max-w-4xl mx-auto w-full">
<!-- Timer & Session Context -->
<div class="w-full flex flex-col items-center mb-16 text-center">
<div class="mb-2 px-4 py-1 rounded-full bg-error-container text-on-error-container font-headline text-xs font-bold uppercase tracking-widest">
                Speed Mode Active
            </div>
<h1 class="text-7xl md:text-9xl font-headline font-extrabold text-error timer-glow tracking-tighter">
                00:42
            </h1>
<p class="mt-4 text-on-surface-variant font-medium">Keep the momentum going!</p>
</div>
<!-- Word Card (Asymmetric / Editorial Style) -->
<div class="relative w-full max-w-2xl">
<!-- Decorative background element for asymmetry -->
<div class="absolute -top-4 -left-4 w-24 h-24 bg-primary-container/10 rounded-xl -z-10 rotate-12"></div>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_12px_32px_rgba(26,27,30,0.04)] p-12 md:p-20 text-center border border-outline-variant/10">
<span class="text-on-surface-variant text-sm font-label uppercase tracking-widest block mb-4">Translate to Vietnamese</span>
<h2 class="text-5xl md:text-7xl font-headline font-bold text-on-primary-fixed tracking-tight">
                    Resilient
                </h2>
<div class="mt-8 flex justify-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="w-2 h-2 rounded-full bg-outline-variant"></span>
<span class="w-2 h-2 rounded-full bg-outline-variant"></span>
<span class="w-2 h-2 rounded-full bg-outline-variant"></span>
</div>
</div>
<!-- Decorative background element for asymmetry -->
<div class="absolute -bottom-6 -right-6 w-32 h-32 bg-secondary-container/20 rounded-full -z-10"></div>
</div>
<!-- Quick Actions (Shadcn Style) -->
<div class="grid grid-cols-2 gap-6 mt-16 w-full max-w-xl">
<!-- Wrong Button -->
<button class="group flex flex-col items-center gap-3">
<div class="w-full h-16 rounded-xl bg-surface-container-high border border-outline-variant hover:bg-error-container hover:border-error transition-all duration-200 flex items-center justify-center gap-3 shadow-sm active:scale-[0.98]">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-error">close</span>
<span class="font-headline font-semibold text-on-surface">Incorrect</span>
</div>
<div class="flex items-center gap-1.5 px-3 py-1 bg-surface-container rounded-md border border-outline-variant/30">
<span class="material-symbols-outlined text-xs">arrow_back</span>
<span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-tighter font-label">Left</span>
</div>
</button>
<!-- Correct Button -->
<button class="group flex flex-col items-center gap-3">
<div class="w-full h-16 rounded-xl bg-primary text-white hover:bg-primary-container transition-all duration-200 flex items-center justify-center gap-3 shadow-md active:scale-[0.98]">
<span class="material-symbols-outlined">check</span>
<span class="font-headline font-semibold">Correct</span>
</div>
<div class="flex items-center gap-1.5 px-3 py-1 bg-surface-container rounded-md border border-outline-variant/30">
<span class="material-symbols-outlined text-xs">arrow_forward</span>
<span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-tighter font-label">Right</span>
</div>
</button>
</div>
</main>
<!-- Decorative background textures -->
<div class="fixed inset-0 pointer-events-none -z-20 opacity-40">
<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] rounded-full blur-[120px] bg-primary-fixed-dim/20"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[40%] h-[40%] rounded-full blur-[120px] bg-tertiary-fixed-dim/10"></div>
</div>
</body></html>
