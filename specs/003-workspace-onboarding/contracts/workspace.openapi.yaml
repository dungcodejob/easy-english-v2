openapi: 3.0.3
info:
  title: Workspace API
  version: 1.0.0
  description: API contract for Workspace Onboarding Wizard feature

paths:
  /api/v1/workspaces:
    post:
      summary: Create a new workspace
      operationId: createWorkspace
      tags:
        - Workspaces
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkspaceResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Workspace name already exists for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List workspaces for current user
      operationId: listWorkspaces
      tags:
        - Workspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspacesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/workspaces/{workspaceId}:
    get:
      summary: Get workspace by ID
      operationId: getWorkspace
      tags:
        - Workspaces
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/workspaces/check:
    get:
      summary: Check if current user has any workspaces
      operationId: checkHasWorkspace
      tags:
        - Workspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasWorkspaceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateWorkspaceRequest:
      type: object
      required:
        - name
        - language
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "My English Learning"
        description:
          type: string
          nullable: true
          example: "Personal workspace for daily vocabulary"
        workspaceType:
          $ref: '#/components/schemas/WorkspaceType'
        language:
          $ref: '#/components/schemas/Language'
        learningGoal:
          $ref: '#/components/schemas/LearningGoal'
        level:
          $ref: '#/components/schemas/Level'
        dailyTarget:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        studyReminder:
          type: boolean
          default: false
        defaultLearningMode:
          $ref: '#/components/schemas/LearningMode'

    WorkspaceType:
      type: string
      enum:
        - PERSONAL
        - TEAM
        - CLASSROOM
      default: PERSONAL

    Language:
      type: string
      enum:
        - EN
        - VI
        - ES
        - FR
        - DE
        - JA
        - KO
        - ZH

    LearningGoal:
      type: string
      enum:
        - VOCABULARY
        - EXAM_PREP
        - DAILY_PRACTICE
      default: VOCABULARY

    Level:
      type: string
      enum:
        - BEGINNER
        - INTERMEDIATE
        - ADVANCED
      default: BEGINNER

    LearningMode:
      type: string
      enum:
        - FLASHCARD
        - QUIZ
        - SPACED_REPETITION
      default: FLASHCARD

    WorkspaceDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        workspaceType:
          $ref: '#/components/schemas/WorkspaceType'
        language:
          $ref: '#/components/schemas/Language'
        learningGoal:
          $ref: '#/components/schemas/LearningGoal'
        level:
          $ref: '#/components/schemas/Level'
        dailyTarget:
          type: integer
        studyReminder:
          type: boolean
        defaultLearningMode:
          $ref: '#/components/schemas/LearningMode'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWorkspaceResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            message:
              type: string
              example: "Workspace created successfully"

    WorkspaceResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WorkspaceDto'

    ListWorkspacesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDto'

    HasWorkspaceResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            hasWorkspace:
              type: boolean
            workspaceCount:
              type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
